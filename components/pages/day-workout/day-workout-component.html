<script type="text/x-template" id="day-workout-template">
  <app-loading v-if="loading"></app-loading>
  <div v-else>
    <div class="detail-header">
      <div class="detail-title">
        <div>{{dayWorkout.exercise_name}}</div>
        <div style="font-size: 15px; font-weight: 400; color: var(--text-mid); margin-top: 2px;">{{dayWorkout.weight}} kg</div>
      </div>
      <div class="detail-actions">
        <div class="button-icon-div" @click="edit()">
          <i class="fa-solid fa-pen button-icon"></i>
        </div>
        <div class="button-icon-div" @click="remove()">
          <i class="fa-solid fa-trash button-icon"></i>
        </div>
      </div>
    </div>

    <div class="detail-info" style="margin-bottom: 16px;">
      <div class="detail-row">
        <span class="detail-label">Data</span>
        <span class="detail-value">{{dayWorkout.date}}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Categoria</span>
        <span class="detail-value">{{dayWorkout.category_name}}</span>
      </div>
      <div style="border-top: 1px solid var(--border); margin-top: 4px; padding-top: 10px; display: flex; gap: 20px;">
        <span style="font-size: 13px; color: var(--text-mid);">
          <i class="fa-solid fa-clock-rotate-left" style="font-size: 11px;"></i>
          Última: {{ lastExecutedWeight !== null ? lastExecutedWeight + ' kg' : '—' }}
        </span>
        <span style="font-size: 13px; color: var(--text-mid);">
          <i class="fa-solid fa-trophy" style="font-size: 11px;"></i>
          Máxima: {{ maxExecutedWeight !== null ? maxExecutedWeight + ' kg' : '—' }}
        </span>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <span class="chart-title">Carga por dia</span>
        <span class="chart-badge">últimos 30 dias</span>
      </div>
      <canvas id="dw-chart-weight"></canvas>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <span class="chart-title">Execuções acumuladas</span>
        <span class="chart-badge">últimos 30 dias</span>
      </div>
      <canvas id="dw-chart-exec"></canvas>
    </div>
  </div>
</script>
