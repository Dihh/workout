<script type="text/x-template" id="day-workout-template">
  <app-loading v-if="loading"></app-loading>
  <div v-else>
    <div class="detail-header">
      <div class="detail-title">
        <div>{{dayWorkout.exercise_name}}</div>
        <div style="font-size: 15px; font-weight: 400; color: var(--text-mid); margin-top: 2px;">{{dayWorkout.weight}} kg</div>
      </div>
      <div class="detail-actions">
        <div class="button-icon-div" @click="edit()">
          <i class="fa-solid fa-pen button-icon"></i>
        </div>
        <div class="button-icon-div" @click="remove()">
          <i class="fa-solid fa-trash button-icon"></i>
        </div>
      </div>
    </div>
    <div class="detail-info">
      <div class="detail-row">
        <span class="detail-label">Data</span>
        <span class="detail-value">{{dayWorkout.date}}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Categoria</span>
        <span class="detail-value">{{dayWorkout.category_name}}</span>
      </div>
    </div>
  </div>
</script>
