<style>
  .exercise-select-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid #f5f5f5;
    cursor: pointer;
    user-select: none;
  }

  .exercise-select-item:last-child {
    border-bottom: none;
  }

  .exercise-select-check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }

  .exercise-select-check.checked {
    background: var(--primary);
    border-color: var(--primary);
  }

  .exercise-select-check.checked::after {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
  }

  .exercise-select-info {
    flex: 1;
    min-width: 0;
  }

  .exercise-select-name {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .exercise-select-category {
    font-size: 12px;
    color: #999;
  }

  .save-exercises-btn {
    display: block;
    width: calc(100% - 32px);
    margin: 12px 16px;
    padding: 10px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    cursor: pointer;
  }

  .save-exercises-btn:disabled {
    opacity: 0.6;
  }
</style>

<script type="text/x-template" id="location-template">
  <app-loading v-if="loading"></app-loading>
  <div v-else>
    <div class="detail-header">
      <div class="detail-title">{{location.name}}</div>
      <div class="detail-actions">
        <div class="button-icon-div" @click="edit">
          <i class="fa-solid fa-pen button-icon"></i>
        </div>
        <div class="button-icon-div" @click="remove">
          <i class="fa-solid fa-trash button-icon"></i>
        </div>
      </div>
    </div>

    <div class="list-items" style="padding-bottom: 80px;">
      <div
        v-for="exercise in allExercises"
        :key="exercise.id"
        class="exercise-select-item"
        @click="toggleExercise(exercise.id)"
      >
        <div :class="['exercise-select-check', { checked: selectedIds.includes(exercise.id) }]"></div>
        <div class="exercise-select-info">
          <div class="exercise-select-name">{{exercise.name}}</div>
          <div class="exercise-select-category">{{exercise.category_name}}</div>
        </div>
      </div>
    </div>

    <button class="save-exercises-btn" @click="saveExercises" :disabled="saving">
      {{ saving ? 'Salvando...' : 'Salvar exercícios' }}
    </button>
  </div>
</script>
