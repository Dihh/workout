<style>
  .friends-send {
    display: flex;
    gap: 8px;
    padding: 12px 0 4px;
  }

  .friends-send input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
  }

  .friends-send button {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }

  .friends-send button:disabled {
    opacity: 0.6;
  }

  .friends-msg {
    font-size: 13px;
    padding: 4px 0;
    margin-bottom: 4px;
  }

  .friends-msg.success { color: #388e3c; }
  .friends-msg.error   { color: #e53935; }

  .friends-section-title {
    font-size: 12px;
    font-weight: 600;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 12px 0 4px;
  }

  .friend-actions {
    display: flex;
    gap: 8px;
  }

  .btn-accept {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
  }

  .btn-reject {
    background: none;
    color: #e53935;
    border: 1px solid #e53935;
    border-radius: var(--radius);
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
  }

  .list-item-sub {
    font-size: 12px;
    color: #999;
    margin-top: 2px;
  }
</style>

<script type="text/x-template" id="friends-template">
  <app-loading v-if="loading"></app-loading>
  <div v-else class="list-items" style="padding-bottom: 24px;">

    <div style="padding: 0 16px;">
      <div class="friends-send">
        <input v-model="friendEmail" type="email" placeholder="E-mail do amigo" @keyup.enter="sendRequest">
        <button @click="sendRequest" :disabled="sending">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
      <div v-if="success" class="friends-msg success">{{success}}</div>
      <div v-if="error" class="friends-msg error">{{error}}</div>
    </div>

    <template v-if="pendingRequests.length">
      <div class="friends-section-title" style="padding: 12px 16px 4px;">Solicitações recebidas</div>
      <div class="list-item noselect" v-for="req in pendingRequests" :key="req.id">
        <div class="list-item-body">
          <div class="list-item-name">{{req.from_name || req.from_email}}</div>
          <div class="list-item-sub">{{req.from_email}}</div>
        </div>
        <div class="friend-actions">
          <button class="btn-accept" @click="acceptRequest(req.id)">Aceitar</button>
          <button class="btn-reject" @click="rejectRequest(req.id)">Recusar</button>
        </div>
      </div>
    </template>

    <template v-if="pendingSent.length">
      <div class="friends-section-title" style="padding: 12px 16px 4px;">Aguardando resposta</div>
      <div class="list-item" v-for="req in pendingSent" :key="req.id">
        <div class="list-item-body">
          <div class="list-item-name">{{req.to_name || req.to_email}}</div>
          <div class="list-item-sub">{{req.to_email}}</div>
        </div>
        <span style="font-size: 12px; color: #aaa;">Pendente</span>
      </div>
    </template>

    <template v-if="friends.length">
      <div class="friends-section-title" style="padding: 12px 16px 4px;">Meus amigos</div>
      <div class="list-item noselect" v-for="f in friends" :key="f.id" @click="goToFriend(f.id)">
        <div class="list-item-body">
          <div class="list-item-name">{{f.name || f.email}}</div>
          <div class="list-item-sub">{{f.email}}</div>
        </div>
        <i class="fa-solid fa-chevron-right list-item-arrow"></i>
      </div>
    </template>

    <div v-if="!pendingRequests.length && !pendingSent.length && !friends.length" style="padding: 24px 16px; text-align: center; color: #aaa; font-size: 14px;">
      Nenhum amigo ainda.
    </div>

  </div>
</script>
