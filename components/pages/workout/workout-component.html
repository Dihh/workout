<style>
  .plan-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--primary);
    border-radius: var(--radius);
    margin-bottom: 12px;
    cursor: pointer;
    user-select: none;
  }

  .plan-card-icon {
    font-size: 22px;
    color: #fff;
    opacity: 0.9;
  }

  .plan-card-text {
    color: #fff;
    font-size: 15px;
    font-weight: 600;
  }

  .plan-card-arrow {
    margin-left: auto;
    color: rgba(255,255,255,0.6);
    font-size: 14px;
  }
</style>

<script type="text/x-template" id="workout-template">
  <app-loading v-if="loading"></app-loading>
  <div v-else>
    <div class="detail-header">
      <div class="detail-title">{{workout.name}}</div>
      <div class="detail-actions">
        <div class="button-icon-div" @click="edit()">
          <i class="fa-solid fa-pen button-icon"></i>
        </div>
        <div class="button-icon-div" @click="remove()">
          <i class="fa-solid fa-trash button-icon"></i>
        </div>
      </div>
    </div>
    <div class="plan-card" @click="goTo('workout-plan', id)">
      <i class="fa-solid fa-calendar-days plan-card-icon"></i>
      <span class="plan-card-text">Planejar treino</span>
      <i class="fa-solid fa-chevron-right plan-card-arrow"></i>
    </div>

    <div class="detail-info" v-if="locationName" style="margin-bottom: 12px;">
      <div class="detail-row">
        <span class="detail-label">Local</span>
        <span class="detail-value">{{locationName}}</span>
      </div>
    </div>

    <div class="list-items" style="padding-bottom: 80px;">
      <div class="list-item noselect" v-for="exercise, index in exercises">
        <div class="list-item-body">
          <div class="list-item-name">{{exercise.exercise_name}}</div>
        </div>
        <i class="fa-solid fa-trash" style="color: #ccc; font-size: 15px; padding: 4px;" @click="remove_exercise(exercise.id)"></i>
      </div>
    </div>
  </div>
  <div class="add-button" @click="goTo('workout-exercise-form', id)">+</div>
</script>
