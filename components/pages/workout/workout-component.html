<script type="text/x-template" id="workout-template">
  <app-loading v-if="loading"></app-loading>
  <div v-else>
    <div class="detail-header">
      <div class="detail-title">{{workout.name}}</div>
      <div class="detail-actions">
        <div class="button-icon-div" @click="edit()">
          <i class="fa-solid fa-pen button-icon"></i>
        </div>
        <div class="button-icon-div" @click="remove()">
          <i class="fa-solid fa-trash button-icon"></i>
        </div>
      </div>
    </div>
    <div class="list-items" style="padding-bottom: 80px;">
      <div class="list-item noselect" v-for="exercise, index in exercises">
        <div class="list-item-body">
          <div class="list-item-name">{{exercise.name}}</div>
        </div>
        <i class="fa-solid fa-trash" style="color: #ccc; font-size: 15px; padding: 4px;" @click="remove_exercise(exercise.id)"></i>
      </div>
    </div>
  </div>
  <div class="add-button" @click="goTo('workout-exercise-form', id)">+</div>
</script>
