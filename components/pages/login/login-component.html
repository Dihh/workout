<style>
  .login-page {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--primary) 0%, var(--primary-darker) 100%);
    padding: 32px 24px;
  }

  .login-logo {
    font-size: 64px;
    color: rgba(255, 255, 255, 0.9);
    margin-bottom: 16px;
  }

  .login-title {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .login-subtitle {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 48px;
    text-align: center;
    max-width: 240px;
  }

  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #fff;
    color: #333;
    font-weight: 600;
    font-size: 15px;
    border: none;
    border-radius: 12px;
    padding: 14px 28px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    transition: opacity 0.2s;
    width: 100%;
    max-width: 280px;
  }

  .btn-google:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .btn-google img {
    width: 20px;
    height: 20px;
  }

  .login-error {
    color: #ffcdd2;
    font-size: 13px;
    margin-top: 16px;
    text-align: center;
  }
</style>

<script type="text/x-template" id="login-template">
  <div class="login-page">
    <i class="fa-solid fa-dumbbell login-logo"></i>
    <div class="login-title">Workout-e</div>
    <div class="login-subtitle">Registre seus treinos e acompanhe seu progresso</div>
    <button class="btn-google" @click="signIn" :disabled="loading">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      <span>{{ loading ? 'Entrando...' : 'Entrar com Google' }}</span>
    </button>
    <div v-if="error" class="login-error">{{ error }}</div>
  </div>
</script>
