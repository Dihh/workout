<script type="text/x-template" id="exercises-template">
  <app-loading v-if="loading"></app-loading>
  <div v-else>
    <div class="detail-header">
      <div class="detail-title">{{exercise.name}}</div>
      <div class="detail-actions">
        <div class="button-icon-div" @click="edit()">
          <i class="fa-solid fa-pen button-icon"></i>
        </div>
        <div class="button-icon-div" @click="remove()">
          <i class="fa-solid fa-trash button-icon"></i>
        </div>
      </div>
    </div>

    <div class="detail-info" style="margin-bottom: 16px;">
      <div class="detail-row">
        <span class="detail-label">Categoria</span>
        <span class="detail-value">{{exercise.category_name}}</span>
      </div>
      <div v-if="exercise.photo" class="detail-row">
        <span class="detail-label">Imagem</span>
        <img :src="exercise.photo" @click="photoExpanded = !photoExpanded"
          :style="photoExpanded ? 'position:fixed;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:1000;cursor:zoom-out;' : 'width:50px;height:50px;object-fit:cover;border-radius:6px;cursor:zoom-in;'">
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <span class="chart-title">Carga por dia</span>
        <span class="chart-badge">últimos 30 dias</span>
      </div>
      <canvas id="chart-weight"></canvas>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <span class="chart-title">Execuções acumuladas</span>
        <span class="chart-badge">últimos 30 dias</span>
      </div>
      <canvas id="chart-exec"></canvas>
    </div>
  </div>
</script>
