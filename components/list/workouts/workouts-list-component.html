<script type="text/x-template" id="workouts-list-template">
  <div>
    <app-loading v-if="loading"></app-loading>
    <div class="list-items" v-else>
      <div class="list-item noselect" v-for="workout in workouts" @click="goTo('workout', workout.id)">
        <div class="list-item-name">{{workout.name}}</div>
        <i class="fa-solid fa-chevron-right list-item-arrow"></i>
      </div>
    </div>
  </div>
  <div class="add-button" @click="goTo('workout-form')">+</div>
</script>
