<script type="text/x-template" id="categorias-list-template">
  <div>
    <app-loading v-if="loading"></app-loading>
    <div class="list-items" v-else>
      <div class="list-item noselect" v-for="category in categories" @click="goTo('categoria', category.id)">
        <div class="list-item-name">{{category.name}}</div>
        <i class="fa-solid fa-chevron-right list-item-arrow"></i>
      </div>
    </div>
  </div>
  <div class="add-button" @click="goTo('categorias-form')">+</div>
</script>
