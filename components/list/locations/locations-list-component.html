<script type="text/x-template" id="locations-list-template">
  <div>
    <app-loading v-if="loading"></app-loading>
    <div class="list-items" v-else>
      <div class="list-item noselect" v-for="location in locations" @click="goTo('location', location.id)">
        <div class="list-item-name">{{location.name}}</div>
        <i class="fa-solid fa-chevron-right list-item-arrow"></i>
      </div>
    </div>
  </div>
  <div class="add-button" @click="goTo('location-form')">+</div>
</script>
